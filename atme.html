<div class="admin-container">
    <h2 style="text-align: center; color: var(--primary-color);">🚀 নতুন গল্প পাবলিশ করুন</h2>
    <form id="uploadForm">
        <input type="password" id="adminPass" placeholder="Vercel Secret Key" required>
        <input type="text" id="storyTitle" placeholder="গল্পের শিরোনাম (Bilingual)" required>
        <textarea id="storyContent" placeholder="গল্পের মূল টেক্সট এখানে পেস্ট করুন (বাংলা ও ইংরেজি লাইনসহ)..." required></textarea>
        <div class="form-group">
            <label>এক্সেস:</label>
            <select id="isPremium">
                <option value="false">ফ্রি (Daily Free Story)</option>
                <option value="true">প্রিমিয়াম (🔒 Unlock Required)</option>
            </select>
        </div>
        <button type="submit" class="btn-publish" id="submitBtn">📤 স্টোরি আপলোড করুন</button>
    </form>
    <div id="status"></div>
</div>
