<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন - পশুপাখি গল্প</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .admin-container { max-width: 650px; margin: 40px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary-color); }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; font-size: 1rem; }
        textarea { height: 350px; resize: vertical; }
        .btn-publish { background: var(--secondary-color); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .btn-publish:hover { background: #e68a00; transform: translateY(-2px); }
        #status { margin-top: 20px; text-align: center; font-weight: bold; display: none; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2 style="text-align: center; color: var(--primary-color);">🚀 নতুন গল্প পাবলিশ করুন</h2>
        <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 25px;">(সরাসরি বাংলা ও ইংরেজি মিশ্রিত টেক্সট পেস্ট করুন)</p>

        <form id="uploadForm">
            <div class="form-group" style="background: #fff3e0; padding: 15px; border-radius: 10px;">
                <label>🔑 Admin Secret Key:</label>
                <input type="password" id="adminPass" placeholder="Vercel-এ সেট করা পাসওয়ার্ড দিন..." required>
            </div>
            
            <div class="form-group">
                <label>গল্পের শিরোনাম:</label>
                <input type="text" id="storyTitle" placeholder="যেমন: বিজ্ঞ ময়না ও দুই বন্ধুর ঝগড়া" required>
            </div>

            <div class="form-group">
                <label>গল্পের কন্টেন্ট (Bilingual Text):</label>
                <textarea id="storyContent" placeholder="গল্পের বাংলা এবং ইংরেজি লাইনগুলো এখানে পেস্ট করুন..." required></textarea>
            </div>

            <div class="form-group">
                <label>এক্সেস টাইপ:</label>
                <select id="isPremium">
                    <option value="false">ফ্রি প্ল্যান (Daily Story)</option>
                    <option value="true">প্রিমিয়াম এক্সেস (🔒 Unlock Required)</option>
                </select>
            </div>

            <button type="submit" class="btn-publish" id="submitBtn">📤 স্টোরি পাবলিশ করুন</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            
            btn.innerText = "আপলোড হচ্ছে, দয়া করে অপেক্ষা করুন...";
            btn.disabled = true;

            const payload = {
                password: document.getElementById('adminPass').value,
                title: document.getElementById('storyTitle').value,
                story_content: document.getElementById('storyContent').value,
                is_premium: document.getElementById('isPremium').value === "true"
            };

            try {
                // api/admin-upload.js ফাইলে রিকোয়েস্ট পাঠানো হচ্ছে
                const response = await fetch('/api/admin-upload', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                status.style.display = "block";
                if (response.ok) {
                    status.innerText = "✅ " + result.message;
                    status.style.background = "#C8E6C9";
                    status.style.color = "#2E7D32";
                    document.getElementById('uploadForm').reset();
                } else {
                    status.innerText = "❌ " + result.error;
                    status.style.background = "#FFCDD2";
                    status.style.color = "#D32F2F";
                }
            } catch (err) {
                status.innerText = "❌ সার্ভারের সাথে কানেকশন এরর!";
                status.style.background = "#FFCDD2";
            } finally {
                btn.innerText = "📤 স্টোরি পাবলিশ করুন";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
