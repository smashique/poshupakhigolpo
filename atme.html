<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>অ্যাডমিন - পশুপাখি গল্প</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box { max-width: 600px; margin: 30px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .btn-submit { background: #FB8C00; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2 style="text-align: center; color: #2E7D32;">📖 নতুন গল্প পাবলিশ করুন</h2>
        <form id="storyForm">
            <input type="password" id="pass" placeholder="অ্যাডমিন পাসওয়ার্ড" required>
            <input type="text" id="title" placeholder="গল্পের শিরোনাম" required>
            <textarea id="content" placeholder="গল্পের বিষয়বস্তু..." required></textarea>
            <select id="premium">
                <option value="true">প্রিমিয়াম (🔒 Premium)</option>
                <option value="false">ফ্রি (Free)</option>
            </select>
            <button type="submit" class="btn-submit" id="btn">পাবলিশ করুন</button>
        </form>
        <div id="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL = 'https://xptwwlrcygimfislsutz.supabase.co'.trim(); 
        const KEY = 'sb_publishable_N0YqY-tMEW_KWxFdS7zgVA_3CgR8Go-'.trim();
        const _supabase = supabase.createClient(URL, KEY);
        const ADMIN_PASS = "AIMe2025to30"; 

        document.getElementById('storyForm').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');
            
            if (document.getElementById('pass').value !== ADMIN_PASS) {
                status.innerText = "failed: পাসওয়ার্ড ভুল!";
                status.style.display = "block"; status.style.background = "#ffebee";
                return;
            }

            btn.disabled = true; btn.innerText = "পাবলিশ হচ্ছে...";
            const storyData = {
                title: document.getElementById('title').value.trim(),
                content: document.getElementById('content').value.trim(),
                is_premium: document.getElementById('premium').value === "true"
            };

            try {
                const { error } = await _supabase.from('stories').insert([storyData]);
                status.style.display = "block";
                if (error) {
                    status.innerText = "failed: " + error.message;
                    status.style.background = "#ffebee";
                } else {
                    status.innerText = "AlHamdulillah published Successfully";
                    status.style.background = "#e8f5e9";
                    document.getElementById('storyForm').reset();
                }
            } catch (err) { status.innerText = "failed: এরর!"; }
            finally { btn.disabled = false; btn.innerText = "পাবলিশ করুন"; }
        };
    </script>
</body>
</html>
