<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিরাপদ এডমিন প্যানেল - পশুপাখি গল্প</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .admin-container { max-width: 800px; margin: 30px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary-color); }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-family: inherit; font-size: 1rem; }
        .secret-box { background: #fff3e0; padding: 15px; border-radius: 10px; border: 1px dashed var(--secondary-color); margin-bottom: 25px; }
        .btn-submit { background: var(--secondary-color); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.2rem; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background: #e68a00; transform: translateY(-2px); }
        .status-msg { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
        .success { display: block; background: #C8E6C9; color: #2E7D32; }
        .error { display: block; background: #FFCDD2; color: #D32F2F; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2 style="text-align: center; color: var(--primary-color);">🚀 নতুন গল্প আপলোড প্যানেল</h2>
        <p style="text-align: center; color: #666; margin-bottom: 25px;">শুধুমাত্র এডমিন ব্যবহারের জন্য।</p>

        <form id="storyForm">
            <div class="secret-box">
                <label style="color: #e65100;">🔑 Admin Secret Key:</label>
                <input type="password" id="adminSecret" placeholder="আপনার গোপন পাসওয়ার্ডটি দিন..." required>
            </div>

            <div class="form-group">
                <label>গল্পের শিরোনাম:</label>
                <input type="text" id="title" placeholder="যেমন: বুদ্ধিমান হাতি ও দয়ালু পাখি" required>
            </div>

            <div class="form-group">
                <label>SVG থাম্বনেইল (Faceless Line-art):</label>
                <textarea id="thumbnail_url" placeholder='<svg>...</svg> অথবা ইমেজের লিঙ্ক' required></textarea>
            </div>

            <div class="form-group">
                <label>গল্পের HTML কন্টেন্ট (webapp_html):</label>
                <textarea id="webapp_html" placeholder="গল্পের মূল বডি কোড এখানে দিন..." required></textarea>
            </div>

            <div class="form-group">
                <label>এক্সেস লেভেল:</label>
                <select id="is_premium">
                    <option value="false">ফ্রি (সবাই পড়তে পারবে)</option>
                    <option value="true">প্রিমিয়াম (৳২৯৯ মেম্বারদের জন্য 🔒)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">📤 এখনই পাবলিশ করুন</button>
        </form>

        <div id="status" class="status-msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase কনফিগারেশন
        const _supabase = supabase.createClient("আপনার_সুপাবেস_লিঙ্ক", "আপনার_এনন_কী");

        // আপনার গোপন পাসওয়ার্ড (এটি ভার্সেল এনভায়রনমেন্টে রাখাই ভালো, আপাতত এখানে সেট করুন)
        const MASTER_SECRET = "আপনার_পছন্দমতো_পাসওয়ার্ড"; 

        const form = document.getElementById('storyForm');
        const statusDiv = document.getElementById('status');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const userSecret = document.getElementById('adminSecret').value;

            // পাসওয়ার্ড চেক
            if (userSecret !== MASTER_SECRET) {
                statusDiv.innerText = "❌ ভুল সিক্রেট কী! আপনি গল্প আপলোড করতে পারবেন না।";
                statusDiv.className = "status-msg error";
                return;
            }

            statusDiv.innerText = "⏳ প্রসেসিং হচ্ছে...";
            statusDiv.className = "status-msg";
            statusDiv.style.display = "block";

            const storyData = {
                title: document.getElementById('title').value,
                thumbnail_url: document.getElementById('thumbnail_url').value,
                webapp_html: document.getElementById('webapp_html').value,
                is_premium: document.getElementById('is_premium').value === "true"
            };

            const { error } = await _supabase.from('stories').insert([storyData]);

            if (error) {
                statusDiv.innerText = "⚠️ এরর: " + error.message;
                statusDiv.classList.add("error");
            } else {
                statusDiv.innerText = "✅ আলহামদুলিল্লাহ! গল্পটি সফলভাবে পাবলিশ হয়েছে।";
                statusDiv.classList.add("success");
                form.reset();
            }
        };
    </script>
</body>
</html>
