<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশুপাখি গল্প - ছোটদের জাদুকরী ভুবন</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- লেআউট ও গ্যাপ ফিক্স --- */
        body { margin: 0; padding: 0; background: #fdfbf7; }
        
        /* উপরের বিশাল গ্যাপ কমানো */
        .navbar { 
            padding: 10px 20px; 
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .container { 
            margin-top: 15px !important; /* উপরের গ্যাপ ফিক্স */
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ১০টি গল্পের জন্য ফিক্সড সাইডবার */
        .sidebar {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .thumbnail-list {
            height: 580px; /* ১০টি গল্পের জন্য ফিক্সড উচ্চতা */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* গল্পের রঙিন বক্স (লেখা ওভারল্যাপ ফিক্স) */
        .story-banner {
            min-height: 55px; 
            padding: 10px 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .story-banner div {
            font-size: 1rem;
            font-weight: 700;
            color: #333;
            line-height: 1.3;
        }

        /* FOMO Badge ও বাটন স্টাইল */
        .fomo-badge { background: #e8f5e9; padding: 8px 15px; border-radius: 50px; font-size: 0.9rem; }
        .btn-install { background: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 50px; cursor: pointer; }
        .hidden { display: none !important; }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-area" style="font-weight:bold; color:#2e7d32; font-size:1.2rem;">পশুপাখি গল্প</div>
        
        <div class="header-action-area" style="display:flex; gap:10px; align-items:center;">
            <div class="fomo-badge">
                🎁 ব্যাংকে গল্প জমেছে <span id="totalCount">17</span> টি। ইনশাআল্লাহ আরো আসছে।
            </div>
            <button id="installPwa" class="btn-install hidden">ইন্সটল করুন 📱</button>
        </div>
    </header>

    <main class="container">
        <section class="story-player">
            <div class="player-container" id="playerArea" style="position:relative; border-radius:30px; overflow:hidden; height:75vh; border:8px solid white; box-shadow:0 20px 50px rgba(0,0,0,0.1);">
                <button id="fullscreenBtn" style="position:absolute; bottom:20px; right:20px; z-index:100; background:#2e7d32; color:white; border:none; padding:10px 20px; border-radius:50px; cursor:pointer; font-weight:bold;">📺 বড় পর্দায় পড়ো</button>
                
                <iframe id="storyFrame" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
            </div>

            <div style="text-align:center; margin-top:15px;">
                <button onclick="shareApp()" style="background:white; border:2px solid #2e7d32; padding:10px 25px; border-radius:50px; color:#2e7d32; font-weight:bold; cursor:pointer;">📤 বন্ধুদের সাথে শেয়ার করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 style="margin-top:0; color:#2e7d32; text-align:center;">গল্পের তালিকা</h3>
            <div id="storyList" class="thumbnail-list"></div>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
