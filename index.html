<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশুপাখি গল্প - Bilingual Animal Tales & Stories for Kids</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;">

    <header class="navbar">
        <div class="logo-text" onclick="location.reload()">🐾 পশুপাখি গল্প</div>
    </header>

    <main class="container">
        <div id="trustBox" class="fomo-live hidden" style="grid-column: 1 / -1; margin-bottom: 20px;">
            <span class="dot-pulse"></span> ইতিমদ্ধে <strong id="paidCount">...</strong> জন সচেতন অভিভাবক তাদের সোনামণির জন্য মেম্বারশিপ নিয়েছেন!
        </div>

        <section class="story-player">
            <div class="player-container" id="playerArea">
                <button id="fullscreenBtn" class="fs-pulse-btn">📺 বড় পর্দা</button>
                <iframe id="storyFrame" src="about:blank" allowfullscreen></iframe>
                <div id="lockOverlay" class="lock-overlay hidden"></div>
            </div>
            <div class="player-footer">
                <button onclick="shareApp()" class="btn-share">📤 বন্ধুদের সাথে শেয়ার করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্পের তালিকা [ <span id="totalCount">...</span>টি গল্প ]</h3>
            <div id="storyList" class="thumbnail-list"></div>
        </aside>
    </main>

    <footer class="site-footer">
        <p>সাপোর্ট আইডি: <strong id="footerUid">...</strong></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=28.0"></script>
</body>
</html>
