<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশুপাখি গল্প - ছোটদের গল্পের ভুবন</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;">
    <header class="navbar">
        <div class="logo-wrapper" onclick="window.location.reload()">
            <div class="css-logo"><div class="animal bird"></div><div class="animal elephant"></div><div class="animal bear"></div></div>
            <span class="logo-text">পশুপাখি গল্প</span>
        </div>
        <button id="installPwa" class="btn-install hidden">গল্পগুলো যেন হারিয়ে না যায়, অ্যাপটি ফোনে রাখুন! 📱</button>
    </header>

    <main class="container">
        <section class="story-player">
            <div id="premiumBanner" class="premium-banner">
                <div class="promo-text">
                    <strong>সোনামণির নৈতিক শিক্ষার শ্রেষ্ঠ উপহার! ✨</strong>
                    <p>আমাদের গল্পব্যাংকে এখন <span id="totalCount">...</span>টি গল্প আছে।</p>
                    <p style="color: #2E7D32; font-size: 0.9rem;">(গল্প না কিনলেও প্রতিদিন ১টি নতুন গল্প পড়ার সুযোগ!)</p>
                </div>
                <button class="btn-buy-now" onclick="initPayment()">🎁 এখনই উপহার দিন</button>
            </div>

            <div class="player-container" id="playerArea">
                <button id="fullscreenBtn" class="fs-pulse-btn">📺 বড় পর্দায় পড়ো</button>
                <iframe id="storyFrame" src="about:blank" allowfullscreen></iframe>
                <div id="lockOverlay" class="lock-overlay hidden">
                    <div class="lock-content">
                        <div class="animated-lock">🔒</div>
                        <h2>গল্পটি পড়তে প্রিমিয়াম এক্সেস প্রয়োজন</h2>
                        <button onclick="initPayment()" class="btn-unlock">এখনই আনলক করুন</button>
                    </div>
                </div>
            </div>
            <div id="uidDisplay" style="padding: 10px; font-size: 0.75rem; color: #aaa; text-align: center;">ইউনিক আইডি: ...</div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্পের তালিকা</h3>
            <div id="storyList" class="thumbnail-list"></div>
            <button id="refreshStories" class="btn-refresh">✨ আরো গল্প দেখুন</button>
        </aside>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="icon.js"></script><script src="app.js"></script>
</body>
</html>
