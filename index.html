<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>পশুপাখি গল্প - Bilingual Animal Tales & Stories for Kids</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body oncontextmenu="return false;">

    <header class="navbar">
        <button id="installPwa" class="btn-install hidden">🪁 No need searching! Just Install App🎯</button>
    </header>

    <main class="container">
        <div id="trustBox" class="trust-banner hidden">
            <span class="dot-pulse"></span> ইতিমদ্ধে <strong id="paidCount">...</strong> জন সচেতন অভিভাবক মেম্বারশিপ নিয়েছেন!
        </div>

        <section class="story-player">
            <div class="player-container" id="playerArea">
                <button id="fullscreenBtn" class="fs-pulse-btn">📺 বড় পর্দা</button>
                <iframe id="storyFrame" src="about:blank" allowfullscreen></iframe>
                <div id="lockOverlay" class="lock-overlay hidden"></div>
            </div>
            <div class="player-footer">
                <button onclick="shareApp()" class="btn-share">📤 বন্ধুদের সাথে শেয়ার করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্পের তালিকা [<span id="totalCount">...</span>]</h3>
            <div id="storyList" class="thumbnail-list"></div>
        </aside>
    </main>
    
    <footer class="site-footer">
        <div class="footer-container">
            <p>সাপোর্ট আইডি: <strong id="footerUid" onclick="copySupportId()" title="কপি করতে ক্লিক করুন">...</strong></p>
            <div class="footer-brand" onclick="location.reload()">poshupakhigolpo.online</div>
            <p>Developed by: <strong>ITCraftBangladesh</strong></p>
            <p>হোয়াটসঅ্যাপ সাপোর্ট: <strong>+8801303680618</strong></p>
            <p class="copyright">© 2026 ITCraftBangladesh | সোনামণিদের নিরাপদ গল্পের ভুবন।</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=28.4"></script>
    <script>
        function copySupportId() {
            const el = document.getElementById('footerUid');
            const uid = el.innerText;
            if (uid && uid !== "...") {
                navigator.clipboard.writeText(uid).then(() => {
                    const originalText = uid;
                    el.innerText = "কপি হয়েছে!";
                    el.style.color = "#25D366";
                    setTimeout(() => { el.innerText = originalText; el.style.color = "#2E7D32"; }, 1500);
                });
            }
        }
    </script>
</body>
</html>
