<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="RXVoYBWqB5KlXCJPsWBQWB42tljv-7ERX509DML0M60" />
    <title>পশুপাখি গল্প - Encyclopedia of Moral Stories for Kids ✨</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;">
    <main class="container">
        <section class="story-player">
            <div class="player-container" id="playerArea">
                <button id="fullscreenBtn" class="fs-pulse-btn" onclick="window.toggleFullscreen()">📺 বড় পর্দায় দেখুন</button>
                <iframe id="storyFrame" src="about:blank" allowfullscreen></iframe>
            </div>
            <div class="player-footer">
                <button onclick="window.shareApp()" class="btn-share">🎁 প্রিয়জনদের সাথে চমৎকার এই গল্পটি শেয়ার করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্প জমেছে [<span id="totalCount">...</span>] টি।</h3>
            <div class="selector-group">
                <label class="sel-label">সিরিজ অনুযায়ী খুঁজুন:</label>
                <select id="seriesSelect" onchange="window.handleSeriesChange()">
                    <option value="All">সকল গল্প (Show All Stories)</option>
                </select>
            </div>
            
            <div id="storyList" class="thumbnail-list"></div>
            
            <div class="search-container">
                <input type="text" id="storySearch" placeholder="🔍 গল্পের নাম লিখুন..." oninput="window.filterStories()">
            </div>
        </aside>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p class="support-text">সাপোর্ট আইডি: <br> <strong id="footerUid" onclick="copySupportId()">...</strong></p>
            <div class="footer-brand" onclick="location.reload()">poshupakhigolpo.online</div>
            <p>© 2026 ITCraftBangladesh | সোনামণিদের নিরাপদ গল্পের ভুবন।</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        function copySupportId() {
            const el = document.getElementById('footerUid');
            const uid = el.innerText;
            if (uid && uid !== "...") {
                navigator.clipboard.writeText(uid).then(() => {
                    const original = uid; el.innerText = "কপি হয়েছে!";
                    setTimeout(() => { el.innerText = original; }, 1500);
                });
            }
        }
    </script>
</body>
</html>
