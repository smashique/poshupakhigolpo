<body oncontextmenu="return false;">

    <main class="container">
        <section class="story-player">
            <div class="player-container" id="playerArea">
                <button id="fullscreenBtn" class="fs-pulse-btn" onclick="toggleFullscreen()">📺 বড় পর্দা</button>
                <iframe id="storyFrame" src="about:blank" allowfullscreen></iframe>
            </div>
            <div class="player-footer">
                <button onclick="shareApp()" class="btn-share">🎁 গল্পটি শেয়ার করুন</button>
                <button id="installPwa" class="btn-install-footer">🪁 অ্যাপ ইনস্টল করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্প জমেছে [<span id="totalCount">...</span>] টি। ইনশাআল্লাহ আরো... </h3>
            <div id="storyList" class="thumbnail-list"></div>
            
            <div class="search-container">
                <input type="text" id="storySearch" placeholder="🔍 গল্পের নাম লিখুন..." oninput="filterStories()">
            </div>
        </aside>
    </main>
    
    <footer class="site-footer">
        <div class="footer-container">
            <p>সাপোর্ট আইডি: <br> <strong id="footerUid" onclick="copySupportId()" title="কপি করতে ক্লিক করুন">...</strong></p>
            <div class="footer-brand" onclick="location.reload()">poshupakhigolpo.online</div>
            <p>Developed by: <strong>ITCraft Bangladesh</strong></p>
            <p class="copyright">© 2026 ITCraftBangladesh | সোনামণিদের নিরাপদ গল্পের ভুবন।</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        function copySupportId() {
            const el = document.getElementById('footerUid');
            const uid = el.innerText;
            if (uid && uid !== "...") {
                navigator.clipboard.writeText(uid).then(() => {
                    const original = uid;
                    el.innerText = "কপি হয়েছে!";
                    el.style.color = "#25D366";
                    setTimeout(() => { el.innerText = original; el.style.color = "#2E7D32"; }, 1500);
                });
            }
        }
    </script>
</body>
