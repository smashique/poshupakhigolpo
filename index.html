<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশুপাখি গল্প - ছোটদের জাদুকরী ভুবন</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- এক্সপার্ট লেআউট ও স্পেসিং ফিক্স --- */
        
        body { margin: 0; padding: 0; }

        /* উপরের বিশাল গ্যাপ কমানো */
        .navbar { 
            padding: 10px 20px; 
            min-height: 60px;
            margin-bottom: 0; 
        }

        .container { 
            margin-top: 10px !important; /* উপরের গ্যাপ কমানো হয়েছে */
            padding-top: 0 !important;
            gap: 20px;
        }

        /* ১০টি গল্পের জন্য নিখুঁত সাইডবার */
        .sidebar {
            padding: 15px !important;
            border-radius: 30px !important;
            max-height: 80vh;
        }

        .thumbnail-list {
            height: 550px; /* ১০টি গল্পের জন্য আইডিয়াল হাইট */
            overflow-y: auto;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px; /* বক্সগুলোর মাঝে গ্যাপ */
        }

        /* গল্পের রঙিন বক্স (টেক্সট ওভারল্যাপ ফিক্স) */
        .story-banner {
            min-height: 50px !important; 
            height: auto !important; /* টেক্সট বড় হলে বক্স বড় হবে */
            padding: 10px 15px;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.3s;
            cursor: pointer;
        }

        .story-banner div {
            font-size: 1rem !important;
            line-height: 1.3;
            color: #2c3e50 !important;
            font-weight: 600 !important;
            word-wrap: break-word; /* লম্বা নাম বক্সের ভেতর রাখবে */
        }

        .story-banner:hover { transform: scale(1.02); }

        /* স্ক্রলবার হাইড করে ক্লিন লুক দেওয়া */
        .thumbnail-list::-webkit-scrollbar { width: 4px; }
        .thumbnail-list::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="dream-cloud" style="top: 5%; font-size: 4rem;">☁️</div>
    <div class="dream-cloud" style="top: 15%; right: 10%; font-size: 2rem;">🎈</div>

    <header class="navbar">
        </header>

    <main class="container">
        <section class="story-player">
            <div class="player-container" id="playerArea">
                <iframe id="storyFrame" src="about:blank"></iframe>
            </div>
            <div class="player-footer-actions">
                <button onclick="shareApp()" class="btn-share">📤 বন্ধুদের সাথে শেয়ার করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 style="margin-top:0; text-align:center; color:#2E7D32;">গল্পের তালিকা</h3>
            <div id="storyList" class="thumbnail-list"></div>
        </aside>
    </main>

    </body>
</html>
