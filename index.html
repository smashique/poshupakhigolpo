<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশুপাখি গল্প - ছোটদের গল্পের ভুবন</title>
    
    <meta name="theme-color" content="#2E7D32">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;">

    <div class="jungle-wrapper">
        <div class="jungle-layer layer-1"></div>
        <div class="jungle-layer layer-2"></div>
        <div class="jungle-layer layer-3"></div>
    </div>

    <header class="navbar">
        <div class="logo-wrapper" onclick="window.location.reload()">
            <div class="css-logo">
                <div class="animal bird"></div>
                <div class="animal elephant"></div>
                <div class="animal bear"></div>
            </div>
            <span class="logo-text">পশুপাখি গল্প</span>
        </div>
        
        <button id="installPwa" class="btn-install hidden">অ্যাপ ডাউনলোড</button>
    </header>

    <main class="container">
        <section class="story-player">
            <div id="premiumBanner" class="premium-banner">
                <div class="premium-content">
                    <div class="promo-text">
                        <strong>আপনার সোনামণিকে দিন সেরা উপহার! ✨</strong>
                        <p>সব জাদুকরী ও শিক্ষামূলক গল্প আনলক করুন আজই।</p>
                    </div>
                    <div class="price-action">
                        <div class="price-tag"><del>৳৪৯৯</del> <strong>৳২৯৯</strong></div>
                        <button class="btn-buy-now" onclick="initPayment()">🎁 এখনই উপহার দিন</button>
                    </div>
                </div>
            </div>

            <div class="player-container">
                <iframe id="storyFrame" src="about:blank" frameborder="0" allowfullscreen></iframe>
                <div id="lockOverlay" class="lock-overlay hidden">
                    <div class="lock-content">
                        <div class="animated-lock">🔒</div>
                        <h2>গল্পটি পড়তে প্রিমিয়াম এক্সেস প্রয়োজন</h2>
                        <button onclick="initPayment()" class="btn-unlock">এখনই আনলক করুন</button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্পের তালিকা</h3>
            <div id="storyList" class="thumbnail-list">
                </div>
            <button id="refreshStories" class="btn-refresh">✨ আরো জাদুর গল্প দেখুন</button>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="icon.js"></script> <script src="app.js"></script>  </body>
</html>
