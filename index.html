<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশুপাখি গল্প - Bilingual Animal Tales & Stories for Kids</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body oncontextmenu="return false;">

    <header class="navbar">
        <button id="installPwa" class="btn-install hidden">🪁 No need searching! Just Install App🎯</button>
    </header>

    <main class="container">
            <section class="story-player">
            <div class="player-container" id="playerArea">
                <button id="fullscreenBtn" class="fs-pulse-btn">📺 বড় পর্দা</button>
                <iframe id="storyFrame" src="about:blank" allowfullscreen></iframe>
                <div id="lockOverlay" class="lock-overlay hidden"></div>
            </div>
            <div class="player-footer">
                <button onclick="shareApp()" class="btn-share">📤 বন্ধুদের সাথে শেয়ার করুন</button>
            </div>
        </section>

        <aside class="sidebar">
            <h3 class="sidebar-title">গল্পের তালিকা [ <span id="totalCount">...</span>টি গল্প ]</h3>
            <div id="storyList" class="thumbnail-list"></div>
        </aside>
    </main>
   
    <footer class="site-footer" style="padding: 25px; border-top: 1px solid #e0e0e0; margin-top: 40px; text-align: center; color: #555;">
    <div class="footer-container">
        <p style="margin: 5px 0; font-size: 0.9rem;">
            সাপোর্ট আইডি: 
            <strong id="footerUid" onclick="copySupportId()" title="কপি করতে ক্লিক করুন" style="cursor: pointer; color: #2E7D32; border-bottom: 1px dashed #2E7D32;">...</strong>
        </p>

        <div class="logo-text" onclick="location.reload()" style="cursor: pointer; margin: 10px 0; font-weight: bold; color: var(--primary-green);">
            poshupakhigolpo.online
        </div>

        <p style="margin: 5px 0; font-size: 1rem;"> Developed by: <strong>ITCraftBangladesh</strong></p>
        
        <p style="margin: 5px 0; font-size: 0.95rem; color: #333;">
            হোয়াটসঅ্যাপ সাপোর্ট: <strong>+8801303680618</strong>
        </p>
        
        <p style="font-size: 0.8rem; color: #999; margin-top: 15px;">© 2026 ITCraftBangladesh | সোনামণিদের জন্য নিরাপদ ও নৈতিক গল্পের ভুবন।</p>
    </div>
</footer>

<script>
/**
 * সাপোর্ট আইডি ক্লিপবোর্ডে কপি করার ফাংশন
 */
function copySupportId() {
    const uidElement = document.getElementById('footerUid');
    const uid = uidElement.innerText;
    
    if (uid && uid !== "...") {
        navigator.clipboard.writeText(uid).then(() => {
            // মাইক্রো-ইন্টারঅ্যাকশন: ইউজার ফিডব্যাক
            const originalText = uid;
            uidElement.innerText = "কপি হয়েছে!";
            uidElement.style.color = "#25D366";
            
            setTimeout(() => {
                uidElement.innerText = originalText;
                uidElement.style.color = "#2E7D32";
            }, 1500);
        }).catch(err => {
            console.error('Copy failed', err);
        });
    }
}
</script>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=28.1"></script>

    
</body>
