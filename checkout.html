<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PoshuPakhiGolpo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .checkout-container { max-width: 500px; margin: 50px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: var(--shadow); text-align: center; }
        .benefit-list { text-align: left; margin: 20px 0; padding-left: 20px; }
        .benefit-list li { margin: 10px 0; color: #444; font-size: 1.1rem; }
        .wa-support { display: inline-flex; align-items: center; gap: 8px; color: #25D366; text-decoration: none; font-weight: bold; margin-top: 20px; border: 1px solid #25D366; padding: 8px 15px; border-radius: 50px; }
        .lifetime-badge { background: #ffeb3b; color: #000; padding: 5px 15px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="lifetime-badge">♾️ LIFETIME UNLOCK</div>
        <h2 style="color: var(--secondary-color);">আপনার সোনামণির হাসির জন্য মাত্র এক ধাপ দূরে!</h2>
        
        <div class="price-tag" style="margin: 20px 0;">
            <span style="font-size: 1.2rem; color: #888;"><del>৳৪৯৯</del></span>
            <span style="font-size: 2.5rem; color: var(--accent-red); font-weight: bold;"> ৳২৯৯</span>
        </div>

        <ul class="benefit-list">
            <li>✅ Unlimited Stream of Educational Stories.</li>
            <li>✅ একবার কিনুন, আজীবন ব্যবহার করুন।</li>
            <li>✅ কোনো Monthly চার্জ নেই।</li>
            <li>✅ নিরাপদ পেমেন্ট (বিকাশ ও রকেট)।</li>
        </ul>

        <button class="btn-buy-now" id="payBtn" style="width: 100%; font-size: 1.3rem;">💳 পেমেন্ট সম্পন্ন করুন</button>

        <p style="margin-top: 20px; font-size: 0.9rem; color: #666;">যেকোনো সমস্যায় আমাদের সাথে যোগাযোগ করুন:</p>
        <a href="https://wa.me/8801303680618" class="wa-support" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="20" alt="WA"> 
            WhatsApp করুন
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // checkout.html এর ভেতরের স্ক্রিপ্ট
document.getElementById('payBtn').onclick = async () => {
    const deviceId = localStorage.getItem('device_uuid'); // ইউজারের আইডি
    const btn = document.getElementById('payBtn');
    
    btn.innerText = "অপেক্ষা করুন...";
    btn.disabled = true;

    try {
        const response = await fetch('/api/create-payment', {
            method: 'POST',
            body: JSON.stringify({ deviceId })
        });
        const data = await response.json();
        
        if (data.payment_url) {
            window.location.href = data.payment_url; // পেমেন্ট গেটওয়েতে নিয়ে যাওয়া
        } else {
            alert('পেমেন্ট শুরু করতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।');
            btn.innerText = "💳 পেমেন্ট সম্পন্ন করুন";
            btn.disabled = false;
        }
    } catch (err) {
        alert('ইন্টারনেট কানেকশন চেক করুন।');
        btn.innerText = "💳 পেমেন্ট সম্পন্ন করুন";
        btn.disabled = false;
    }
};
    </script>
</body>
</html>
