<script>
    function toggleInputOptions() {
        const method = document.getElementById('method').value;
        const typeGroup = document.getElementById('typeSelectorGroup');
        const inputLabel = document.getElementById('inputLabel');
        const trxInfo = document.getElementById('trxInfo');

        if (method === 'DBBL') {
            typeGroup.classList.add('hidden');
            inputLabel.innerText = "TrxID দিন";
            trxInfo.placeholder = "আপনার TrxID লিখুন";
        } else {
            typeGroup.classList.remove('hidden');
            inputLabel.innerText = "আপনার তথ্য দিন";
            trxInfo.placeholder = "এখানে লিখুন...";
        }
    }

    function sendToWhatsApp() {
        const uuid = localStorage.getItem('device_uuid') || 'User';
        const method = document.getElementById('method').value;
        const infoType = (method === 'DBBL') ? 'TrxID' : document.getElementById('infoType').value;
        const infoValue = document.getElementById('trxInfo').value.trim();
        
        // ১. ভ্যালিডেশন: পেমেন্ট ডিটেইলস না দিলে কাজ করবে না
        if(!infoValue) { 
            alert("অনুগ্রহ করে পেমেন্ট তথ্য (TrxID অথবা লাস্ট ৪ ডিজিট) দিন!"); 
            return; 
        }
        
        // ২. আপনার দেওয়া নির্দিষ্ট মেসেজ বয়ান
        const phoneNumber = "8801303680618";
        const msg = `আসসালামু আলাইকুম। আমি 'পশুপাখি গল্প' অ্যাপটির প্রিমিয়াম ভার্সন আনলক করার জন্য পেমেন্ট করেছি। অনুগ্রহ করে আনলক করে দিন।\n\n` +
                    `🆔 ইউজার আইডি: ${uuid}\n` +
                    `💳 পেমেন্ট মেথড: ${method}\n` +
                    `📝 তথ্যের ধরণ: ${infoType}\n` +
                    `🔢 পেমেন্ট তথ্য: ${infoValue}`;

        window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // পেজ লোড হওয়ার সময় মেথড চেক করা
    window.onload = toggleInputOptions;
</script>
